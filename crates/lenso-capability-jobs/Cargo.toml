[package]
name = "lenso-capability-jobs"
version = "0.1.2"
description = "Portable durable Jobs Capability for Lenso applications."
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
futures.workspace = true
# Keep runtime client traits on the protocol graph used by current linked Hosts.
lenso-contract-runtime = { version = "0.1.3", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
lenso-kernel = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "cd35675a191d815b690c8889756dfe859a0e4d7b" }
lenso-plugin-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
# Codegen 0.6.4 fixes independent package verification without changing the Contract.
lenso-contract-codegen = { version = "0.6.4", git = "https://github.com/LioRael/lenso-protocols", rev = "9d2774c767fd64a6cc63a5ac04360e9cb92816da" }

[lints]
workspace = true
