[package]
name = "lenso-jobs-plugin"
version = "0.1.4"
description = "First-party durable single-step Jobs Plugin for Lenso applications."
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
exclude = ["tests/repository_ownership.rs"]

[features]
default = []
postgres-acceptance = []

[dependencies]
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
lenso-capability-jobs = { path = "../lenso-capability-jobs", version = "0.1.4" }
lenso-capability-secrets = { version = "0.1.1" }
lenso-kernel = { version = "0.2.0" }
lenso-native-adapter = { version = "0.3.0" }
lenso-postgres-kit = { version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
lenso-app-plan = { version = "0.3.0" }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5"

[lints]
workspace = true
