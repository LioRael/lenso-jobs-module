[package]
name = "lenso-jobs-module"
version = "0.1.0"
description = "First-party durable single-step Jobs Module for Lenso applications."
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
postgres-acceptance = []

[dependencies]
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
lenso-capability-jobs = { path = "../lenso-capability-jobs", version = "0.1.0" }
lenso-capability-secrets = { version = "0.1.0", git = "https://github.com/LioRael/lenso-secrets-module", rev = "0f26fc816771ed5b8a84aa0567ca50fd9c3250e0" }
lenso-kernel = "0.1.4"
lenso-native-adapter = "0.1.1"
lenso-postgres-kit = { version = "0.1.0", git = "https://github.com/LioRael/lenso-postgres-kit", rev = "525c1012c789e6f54c3c2fdaf8507a626c93e65f" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
lenso-app-plan = "0.1.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5"

[lints]
workspace = true
